name: Auto Create PR

on:
  push:
    branches:
      - 'feature/**'
      - 'fix/**'
      - 'hotfix/**'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Pull Request if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING_PR=$(gh pr list \
            --head "${{ github.ref_name }}" \
            --base main \
            --json number \
            --jq '.[0].number')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base main \
              --head "${{ github.ref_name }}" \
              --title "$(git log -1 --pretty=%s)" \
              --body "## Automated PR — ${{ github.ref_name }}

          **Pushed by:** ${{ github.actor }}
          **Commit:** \`${{ github.sha }}\`

          ### Before merging confirm:
          - [ ] ADO Validate stage passed
          - [ ] ADO Plan output reviewed
          - [ ] Ready to deploy to UAT"
          else
            echo "PR #$EXISTING_PR already exists — skipping creation"
          fi