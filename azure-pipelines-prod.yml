trigger:
  branches:
    include:
      - main

  paths:
    include:
      - env/prod/**
      - modules/**

pr:
  autoCancel: true

  branches:
    include:
      - main

  paths:
    include:
      - env/prod/**
      - modules/**

variables:
  WORKING_DIR: 'env/prod'
  TF_PLAN_FILE: 'tfplan'
  AZURE_SERVICE_CONNECTION: 'iac-pipeline'

  # Backend config
  BACKEND_RG: 'rg-tfstate-uat'
  BACKEND_STORAGE_ACCOUNT: 'iacdemouat86503'
  BACKEND_CONTAINER: 'tfstate'
  BACKEND_KEY: 'projects/iacdemo/environments/prod/terraform.tfstate'

# ========================
# VALIDATE STAGE
# ========================
stages:
- stage: Validate
  displayName: "Terraform Validate"
  jobs:
  - job: Validate
    pool:
      name: 'Default'
      demands:
        - agent.name -equals iac-self-hosted
    steps:
    - checkout: self

    - script: terraform version
      displayName: "Show Terraform Version"

    - script: terraform fmt -check -recursive
      displayName: "Check Terraform Formatting"

    - script: |
        terraform -chdir=$(WORKING_DIR) init -backend=false
        terraform -chdir=$(WORKING_DIR) validate
      displayName: "Terraform Init (Local) & Validate"

# ========================
# PLAN STAGE
# ========================
- stage: Plan
  displayName: "Terraform Plan"
  dependsOn: Validate
  jobs:
  - job: Plan
    pool:
      name: 'Default'
      demands:
        - agent.name -equals iac-self-hosted
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Azure Login"
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          echo "Current Azure account:"
          az account show

    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: azurerm
        command: init
        workingDirectory: $(WORKING_DIR)
        backendServiceArm: $(AZURE_SERVICE_CONNECTION)
        backendAzureRmResourceGroupName: $(BACKEND_RG)
        backendAzureRmStorageAccountName: $(BACKEND_STORAGE_ACCOUNT)
        backendAzureRmContainerName: $(BACKEND_CONTAINER)
        backendAzureRmKey: $(BACKEND_KEY)
        backendAzureRmAccessKey: $(TF_BACKEND_ACCESS_KEY)

    - task: TerraformTaskV4@4
      displayName: "Terraform Plan"
      inputs:
        provider: azurerm
        command: plan
        workingDirectory: $(WORKING_DIR)
        commandOptions: '-out=$(TF_PLAN_FILE) -var-file=terraform.tfvars'
        environmentServiceNameAzureRM: $(AZURE_SERVICE_CONNECTION)

    - task: PublishPipelineArtifact@1
      displayName: "Publish Terraform Plan"
      inputs:
        targetPath: '$(WORKING_DIR)/$(TF_PLAN_FILE)'
        artifact: 'prod-tfplan'

# ========================
# APPROVAL STAGE
# ========================
- stage: Approval
  displayName: "Manual Approval"
  dependsOn: Plan
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: Approval
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@1
      displayName: "Approve Deployment"
      inputs:
        instructions: |
          Review Terraform plan output in the Plan stage logs or download the tfplan artifact.
          Approve to proceed with Apply, or Reject to abort.
        notifyUsers: 'sarang.gupta@cloud4c.com'
        onTimeout: reject

# ========================
# APPLY STAGE
# ========================
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Approval
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: Apply
    pool:
      name: 'Default'
      demands:
        - agent.name -equals iac-self-hosted
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: "Azure Login"
      inputs:
        azureSubscription: $(AZURE_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az account show

    - task: DownloadPipelineArtifact@2
      displayName: "Download Terraform Plan"
      inputs:
        artifactName: prod-tfplan
        downloadPath: '$(WORKING_DIR)'

    - task: TerraformTaskV4@4
      displayName: "Terraform Init"
      inputs:
        provider: azurerm
        command: init
        workingDirectory: $(WORKING_DIR)
        backendServiceArm: $(AZURE_SERVICE_CONNECTION)
        backendAzureRmResourceGroupName: $(BACKEND_RG)
        backendAzureRmStorageAccountName: $(BACKEND_STORAGE_ACCOUNT)
        backendAzureRmContainerName: $(BACKEND_CONTAINER)
        backendAzureRmKey: $(BACKEND_KEY)
        backendAzureRmAccessKey: $(TF_BACKEND_ACCESS_KEY)

    - task: TerraformTaskV4@4
      displayName: "Terraform Apply"
      inputs:
        provider: azurerm
        command: apply
        workingDirectory: $(WORKING_DIR)
        commandOptions: '$(TF_PLAN_FILE)'
        environmentServiceNameAzureRM: $(AZURE_SERVICE_CONNECTION)

    - script: |
        echo "Fetching outputs..."
        terraform -chdir=$(WORKING_DIR) output || true
      displayName: "Post Deployment Outputs"