trigger: none


variables:
  TF_VERSION: '1.6.x'
  WORKING_DIR: 'env/uat'
  TF_PLAN_FILE: 'tfplan'

  # Azure DevOps Service Connection (NAME, not ID)
  AZURE_SERVICE_CONNECTION: 'iac-pipeline'

stages:

# ========================
# VALIDATE STAGE
# ========================
- stage: Validate
  displayName: "Terraform Validate"
  jobs:
    - job: Validate
      pool:
        name: 'iac-self-hosted'            # ← your agent pool name
        demands:
          - agent.name -equals iac-self-hosted

      steps:
        - checkout: self

        - task: TerraformInstaller@0
          displayName: "Install Terraform"
          inputs:
            terraformVersion: $(TF_VERSION)

        - script: terraform fmt -check -recursive
          displayName: "Check Terraform Formatting"

        - script: |
            terraform -chdir=$(WORKING_DIR) init -backend=false
            terraform -chdir=$(WORKING_DIR) validate
          displayName: "Terraform Init (Local) & Validate"

# ========================
# PLAN STAGE
# ========================
- stage: Plan
  displayName: "Terraform Plan"
  dependsOn: Validate

  jobs:
    - job: Plan
      pool:
        name: 'iac-self-hosted'            # ← your agent pool name
        demands:
          - agent.name -equals iac-self-hosted

      steps:
        - checkout: self

        - task: TerraformInstaller@0
          displayName: "Install Terraform"
          inputs:
            terraformVersion: $(TF_VERSION)

        # Azure login using service connection
        - task: AzureCLI@2
          displayName: "Azure Login"
          inputs:
            azureSubscription: $(AZURE_SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              echo "Current Azure account:"
              az account show

        # Terraform Init (backend config comes from backend.tf)
        - task: TerraformTaskV4@4
          displayName: "Terraform Init"
          inputs:
            provider: azurerm
            command: init
            workingDirectory: $(WORKING_DIR)
            backendServiceArm: $(AZURE_SERVICE_CONNECTION)

        # Terraform Plan
        - task: TerraformTaskV4@4
          displayName: "Terraform Plan"
          inputs:
            provider: azurerm
            command: plan
            workingDirectory: $(WORKING_DIR)
            commandOptions: '-out=$(TF_PLAN_FILE) -var-file=terraform.tfvars'
            environmentServiceNameAzureRM: $(AZURE_SERVICE_CONNECTION)

        # Publish Plan Artifact
        - task: PublishPipelineArtifact@1
          displayName: "Publish Terraform Plan"
          inputs:
            targetPath: '$(WORKING_DIR)/$(TF_PLAN_FILE)'
            artifact: 'tfplan'

# ========================
# APPROVAL STAGE
# ========================
- stage: Approval
  displayName: "Manual Approval"
  dependsOn: Plan

  jobs:
    - job: Approval
      pool: server
      steps:
        - task: ManualValidation@0
          displayName: "Approve Deployment"
          inputs:
            instructions: |
              Review Terraform plan output in logs or download artifact.
              Approve to proceed with Apply.
            notifyUsers: 'sarang.gupta@cloud4c.com'
            onTimeout: reject

# ========================
# APPLY STAGE
# ========================
- stage: Apply
  displayName: "Terraform Apply"
  dependsOn: Approval

  jobs:
    - job: Apply
      pool:
        name: 'iac-self-hosted'            # ← your agent pool name
        demands:
          - agent.name -equals iac-self-hosted

      steps:
        - checkout: self

        - task: TerraformInstaller@0
          displayName: "Install Terraform"
          inputs:
            terraformVersion: $(TF_VERSION)

        # Azure login again (new agent)
        - task: AzureCLI@2
          displayName: "Azure Login"
          inputs:
            azureSubscription: $(AZURE_SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              az account show

        # Download plan artifact
        - task: DownloadPipelineArtifact@2
          displayName: "Download Terraform Plan"
          inputs:
            artifactName: tfplan
            downloadPath: $(WORKING_DIR)

        # Re-init backend
        - task: TerraformTaskV4@4
          displayName: "Terraform Init"
          inputs:
            provider: azurerm
            command: init
            workingDirectory: $(WORKING_DIR)
            backendServiceArm: $(AZURE_SERVICE_CONNECTION)

        # Apply using saved plan
        - task: TerraformTaskV4@4
          displayName: "Terraform Apply"
          inputs:
            provider: azurerm
            command: apply
            workingDirectory: $(WORKING_DIR)
            commandOptions: '$(WORKING_DIR)/$(TF_PLAN_FILE)'
            environmentServiceNameAzureRM: $(AZURE_SERVICE_CONNECTION)

        # Post-deployment output (non-blocking)
        - script: |
            echo "Fetching outputs..."
            terraform -chdir=$(WORKING_DIR) output || true
          displayName: "Post Deployment Outputs"